trigger:
  branches:
    include:
    - main
    - develop
  paths:
    exclude:
    - README.md
    - docs/*

variables:
  - name: vmImageName
    value: 'ubuntu-latest'
  - name: webAppName
    value: 'your-app-name'
  - name: environmentName
    value: 'production'
  - name: projectRoot
    value: $(System.DefaultWorkingDirectory)
  - name: nodeVersion
    value: '18.x'

stages:
- stage: Build
  displayName: Build stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '$(nodeVersion)'
      displayName: 'Install Node.js'
    
    - script: |
        npm install
        npm run build --if-present
        npm run test --if-present
      displayName: 'npm install, build and test'
      workingDirectory: $(projectRoot)
    
    - task: ArchiveFiles@2
      displayName: 'Archive files'
      inputs:
        rootFolderOrFile: '$(projectRoot)'
        includeRootFolder: false
        archiveType: zip
        archiveFile: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
        replaceExistingArchive: true
    
    - upload: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
      artifact: drop

- stage: Deploy
  displayName: Deploy stage
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: Deploy
    displayName: Deploy
    environment: $(environmentName)
    pool:
      vmImage: $(vmImageName)
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Azure Web App Deploy'
            inputs:
              azureSubscription: 'Azure-ARM-Service-Connection'
              appType: 'webAppLinux'
              appName: $(webAppName)
              runtimeStack: 'NODE|18-lts'
              package: $(Pipeline.Workspace)/drop/$(Build.BuildId).zip
              startUpCommand: 'npm run start'
          
          - task: AzureCLI@2
            displayName: 'Restart Web App'
            inputs:
              azureSubscription: 'Azure-ARM-Service-Connection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az webapp restart --name $(webAppName) --resource-group $(resourceGroupName)
          
          - script: |
              sleep 30
              response=$(curl -s -o /dev/null -w "%{http_code}" https://$(webAppName).azurewebsites.net/health)
              if [ $response -eq 200 ]; then
                echo "Health check passed"
              else
                echo "Health check failed with status: $response"
                exit 1
              fi
            displayName: 'Health Check'

- stage: Test
  displayName: Integration Tests
  dependsOn: Deploy
  condition: succeeded()
  jobs:
  - job: IntegrationTests
    displayName: Run Integration Tests
    pool:
      vmImage: $(vmImageName)
    
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '$(nodeVersion)'
      displayName: 'Install Node.js'
    
    - script: |
        npm install
        npm run test:integration
      displayName: 'Run integration tests'
      env:
        TEST_URL: https://$(webAppName).azurewebsites.net